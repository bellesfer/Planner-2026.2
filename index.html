<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF7EF">
<title>Meu Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root{
  --rq:#B85C70; --rp:#EAB9C3; --rc:#F9E9E9; --cr:#FFF7EF; --be:#E8DCCB; --sa:#C8D0BE; --vi:#87364D; --w:#fff;
  --ink:#4A2A33; --mute:#8E6E76; --line:rgba(184,92,112,.16);
  --sage-ink:#6E825F; --peach:#E39A7F; --peach-bg:#F8DDD1;
  --card:rgba(255,255,255,.80); --card-strong:rgba(255,252,250,.93);
  --r:22px; --shadow:0 10px 30px rgba(135,54,77,.10), 0 1px 0 rgba(255,255,255,.8) inset;
  --serif:'Cormorant Garamond', 'Times New Roman', serif;
  --sans:'DM Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--cr);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
mark{background:rgba(234,185,195,.75);color:var(--vi);border-radius:4px;padding:0 2px}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#bg svg{width:100%;height:100%;display:block}

/* ---------- layout ---------- */
#app{position:relative;z-index:1;min-height:100vh;padding:calc(var(--st) + 14px) calc(var(--sr) + 16px) calc(var(--sb) + 104px) calc(var(--sl) + 16px)}
.screen{display:none;max-width:760px;margin:0 auto;animation:fadeUp .35s ease}
.screen.active{display:block}
#s-week{max-width:1280px}
@media (min-width:900px){#s-cal{max-width:1000px}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);border:1px solid rgba(255,255,255,.75);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card + .card,.stack > * + *{margin-top:14px}
.scr-head{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
.scr-head h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.05;margin:0;color:var(--vi);flex:1;letter-spacing:.2px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.8);box-shadow:0 4px 14px rgba(135,54,77,.08);color:var(--rq);transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:19px;height:19px}
.eyebrow{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--rq);font-weight:600}
.serif{font-family:var(--serif)}
.muted{color:var(--mute)}
.small{font-size:13.5px}

/* ---------- tab bar ---------- */
#tabbar{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 12px);display:flex;gap:2px;padding:6px;border-radius:26px;background:rgba(255,250,248,.86);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 34px rgba(135,54,77,.16);width:min(420px,calc(100% - 28px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:20px;color:#A88890;font-size:11px;font-weight:500;transition:background .2s,color .2s}
.tab svg{width:22px;height:22px}
.tab.on{background:var(--rc);color:var(--vi)}
.tab .badge{position:absolute;margin-left:18px;margin-top:-3px;background:var(--rq);color:#fff;font-size:10px;line-height:16px;min-width:16px;padding:0 4px;border-radius:8px;font-weight:600}
.tab-ic{position:relative;display:flex}

/* ---------- home ---------- */
.hello{display:flex;align-items:flex-start;gap:10px;margin:6px 2px 16px}
.hello h1{font-family:var(--serif);font-weight:600;font-style:italic;font-size:40px;line-height:1.02;margin:2px 0 4px;color:var(--vi)}
.hello .date{font-size:15px;color:var(--mute)}
.hello .who{font-size:13px;color:var(--rq);text-decoration:underline;text-underline-offset:3px;margin-top:4px;display:inline-block}
.searchbar{position:sticky;top:calc(var(--st) + 8px);z-index:5;display:flex;align-items:center;gap:9px;width:100%;padding:11px 14px;border-radius:16px;background:rgba(255,247,239,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(234,185,195,.7);box-shadow:0 6px 18px rgba(135,54,77,.08);color:#B39299;text-align:left;margin-bottom:16px}
.searchbar svg{width:18px;height:18px;color:var(--rq);flex:none}
.today-head{display:flex;gap:14px;align-items:center}
.today-head .t{flex:1;min-width:0}
.today-head h2{font-family:var(--serif);font-size:27px;line-height:1.1;margin:2px 0 0;font-weight:600;color:var(--ink)}
.ring{width:66px;height:66px;flex:none;position:relative}
.ring svg{width:66px;height:66px;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--vi)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;background:var(--rq);color:#fff;font-weight:600;font-size:15px;box-shadow:0 6px 16px rgba(184,92,112,.28);transition:transform .15s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--rc);color:var(--vi);box-shadow:none}
.btn.full{width:100%}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.stat{text-align:left;padding:16px}
.stat .n{font-family:var(--serif);font-size:36px;font-weight:600;color:var(--vi);line-height:1}
.stat .l{font-size:13.5px;color:var(--mute);margin-top:4px}
.stat .bar{margin-top:10px}
.bar{height:7px;border-radius:7px;background:rgba(234,185,195,.38);overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--rp),var(--rq));transition:width .5s ease}
.exam-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.exam{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:linear-gradient(135deg,rgba(135,54,77,.95),rgba(184,92,112,.92));color:#fff;text-align:left;width:100%}
.exam .d{font-family:var(--serif);font-size:28px;font-weight:700;line-height:1;width:44px;text-align:center}
.exam .d small{display:block;margin-top:3px;font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;opacity:.85}
.exam .x{flex:1;font-weight:600}
.exam .x small{display:block;font-weight:400;opacity:.85;font-size:12.5px}
.exam .cd{font-size:12.5px;background:rgba(255,255,255,.2);padding:4px 9px;border-radius:20px;white-space:nowrap}
.exam.past{opacity:.55}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.sec-t h3{font-family:var(--serif);font-size:23px;margin:0;font-weight:600;color:var(--vi)}
.link{color:var(--rq);font-weight:600;font-size:14px}

/* ---------- task rows ---------- */
.tlist{display:flex;flex-direction:column}
.trow{display:flex;align-items:flex-start;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);position:relative;background:transparent}
.trow:last-child{border-bottom:0}
.trow .tx{flex:1;min-width:0;padding-top:1px;overflow-wrap:anywhere}
.trow.done .tx,.trow.done .ttext{color:#B49EA4;text-decoration:line-through;text-decoration-color:rgba(184,92,112,.5)}
.chk{flex:none;width:23px;height:23px;border-radius:50%;border:1.6px solid var(--rp);background:rgba(255,255,255,.7);display:grid;place-items:center;margin-top:1px;transition:background .2s,border-color .2s,transform .2s}
.chk svg{width:13px;height:13px;color:#fff;opacity:0;transform:scale(.4);transition:all .2s}
.done > .chk{background:var(--rq);border-color:var(--rq)}
.done > .chk svg{opacity:1;transform:none}
.chk.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.22)}}
.tag{flex:none;font-size:10.5px;font-weight:600;letter-spacing:.4px;padding:2px 8px;border-radius:20px;margin-top:2px;white-space:nowrap}
.tag-n3{background:var(--rc);color:var(--rq);border:1px solid rgba(184,92,112,.25)}
.tag-osce{background:rgba(200,208,190,.55);color:var(--sage-ink);border:1px solid rgba(110,130,95,.25)}
.tag-multi{background:var(--peach-bg);color:#B5623F;border:1px solid rgba(227,154,127,.4)}
.tag-prova{background:var(--vi);color:#fff}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dot-n3{background:var(--rq)} .dot-osce{background:#8FA383} .dot-multi{background:var(--peach)} .dot-prova{background:var(--vi)} .dot-none{background:#C9B39A}
.grip{flex:none;width:22px;height:26px;display:grid;place-items:center;color:#D2B5BC;touch-action:none;cursor:grab;margin-left:-4px}
.grip svg{width:14px;height:14px}
.trow.dragging{opacity:.3}
.ghost{position:fixed;z-index:200;pointer-events:none;background:var(--card-strong);border-radius:14px;box-shadow:0 16px 40px rgba(135,54,77,.25);padding:8px 10px;transform:rotate(-1.2deg) scale(1.02);border:1px solid var(--rp)}
.drop-line{height:3px;border-radius:3px;background:var(--rq);margin:2px 0;box-shadow:0 0 0 3px rgba(184,92,112,.15)}
.drop-on{outline:2px dashed var(--rp);outline-offset:3px}

/* ---------- calendar ---------- */
.cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-nav h2{flex:1;margin:0;font-family:var(--serif);font-size:28px;font-weight:600;text-transform:capitalize;color:var(--ink)}
.cal-nav h2 span{color:var(--rq);font-weight:500}
.nav-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--rc);color:var(--vi)}
.nav-btn:disabled{opacity:.3}
.nav-btn svg{width:17px;height:17px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wd{text-align:center;font-size:11.5px;font-weight:600;color:var(--rq);letter-spacing:.8px;padding-bottom:4px}
.cell{position:relative;min-height:62px;border-radius:14px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(255,255,255,.55);border:1px solid rgba(232,220,203,.7);transition:transform .15s,background .2s}
.cell:active{transform:scale(.95)}
.cell .num{font-size:15px;font-weight:600;line-height:1.2}
.cell .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.cell .frac{font-size:10.5px;color:var(--mute);font-weight:500}
.cell .pv{display:none}
.cell.off{background:transparent;border-color:transparent;color:#CDBFC2;pointer-events:none}
.cell.blank{visibility:hidden}
.cell.today{border:2px solid var(--rq);background:rgba(255,255,255,.9)}
.cell.today .num{color:var(--rq)}
.cell.exam{background:linear-gradient(160deg,var(--vi),var(--rq));color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(135,54,77,.3)}
.cell.exam .frac{color:rgba(255,255,255,.85)}
.cell.exam .lab{font-size:9px;font-weight:700;letter-spacing:1px}
.cell.alldone::after{content:'';position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:#8FA383}
.cell.sel{box-shadow:0 0 0 2px var(--rp)}
.mini .cell{min-height:40px;border-radius:11px;padding:4px 2px;gap:2px}
.mini .cell .num{font-size:13.5px}
.mini .cell .frac{display:none}
.mini .cell .dot{width:5px;height:5px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
@media (min-width:700px){
  .cell{min-height:104px;align-items:stretch;padding:7px 7px}
  .cell .num{font-size:14px;align-self:flex-start}
  .cell .frac{align-self:flex-start}
  .cell .dots{justify-content:flex-start}
  .cell .pv{display:block;font-size:11.5px;line-height:1.3;color:var(--ink);text-align:left;overflow:hidden}
  .cell .pv div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .pv .d{color:#B49EA4;text-decoration:line-through}
  .cell.exam .pv{color:#fff}
  .mini .cell{min-height:40px;align-items:center}
  .cell.off,.cell.blank{min-height:44px}
  .mini .cell .pv{display:none}
}
.agenda{margin-top:14px}
.ag-day{display:flex;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.ag-day:last-child{border-bottom:0}
.ag-date{width:46px;flex:none;text-align:center}
.ag-date .n{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1;color:var(--vi)}
.ag-date .w{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--rq);font-weight:600}
.ag-day.exam .ag-date .n{color:#fff;background:var(--vi);border-radius:12px;padding:4px 0}
.ag-body{flex:1;min-width:0}
.ag-title{font-weight:600;font-size:15px;margin-bottom:2px}
.ag-body .trow{padding:5px 0;border:0}
.ag-body .chk{width:19px;height:19px}
.ag-body .tx{font-size:14.5px}
.fab{position:fixed;z-index:19;right:calc(var(--sr) + 20px);bottom:calc(var(--sb) + 94px);width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,var(--rq),var(--vi));color:#fff;display:none;place-items:center;box-shadow:0 10px 24px rgba(135,54,77,.35);transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab svg{width:24px;height:24px}
body[data-tab="cal"] .fab,body[data-tab="week"] .fab{display:grid}

/* ---------- week ---------- */
.week-top{margin-bottom:14px}
.week-top .bar{margin-top:8px;height:8px}
.week-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:1000px){.week-grid{grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.wcard{min-height:340px}}
@media (min-width:640px) and (max-width:999px){.week-grid{grid-template-columns:1fr 1fr}}
.wcard{padding:14px 14px 10px;display:flex;flex-direction:column}
.wcard.off{opacity:.45}
.wcard.today{box-shadow:0 0 0 2px var(--rq),var(--shadow)}
.wcard.exam .wh{background:linear-gradient(135deg,var(--vi),var(--rq));color:#fff;margin:-14px -14px 8px;padding:12px 14px;border-radius:var(--r) var(--r) 0 0}
.wcard.exam .wh .w,.wcard.exam .wh .m{color:#fff}
.wh{display:flex;align-items:baseline;gap:8px;text-align:left;width:100%;margin-bottom:6px}
.wh .n{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1}
.wh .w{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--rq);font-weight:600;flex:1}
.wh .m{font-size:12px;color:var(--mute)}
.wtitle{font-size:13.5px;font-weight:600;color:var(--mute);margin-bottom:4px}
.wcard .tlist{flex:1;min-height:30px}
.wcard .trow{padding:6px 0}
.wcard .tx{font-size:14.5px;cursor:pointer}
.wcard .chk{width:20px;height:20px}
.wadd{margin-top:6px;width:100%;border:0;border-top:1px dashed var(--rp);background:transparent;padding:9px 2px 4px;font-size:15px;outline:none}
.wadd::placeholder{color:#C4A3AB}
.wnone{font-size:13px;color:#C4A3AB;padding:6px 0}

/* ---------- pending ---------- */
.seg{display:flex;background:rgba(255,255,255,.6);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px;border:1px solid rgba(255,255,255,.8)}
.seg button{flex:1;padding:8px 6px;border-radius:11px;font-size:14px;font-weight:500;color:var(--mute)}
.seg button.on{background:#fff;color:var(--vi);box-shadow:0 2px 8px rgba(135,54,77,.1)}
.pgroup h4{margin:0 0 4px;display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--rq)}
.pgroup h4 .late{background:var(--vi);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;letter-spacing:.6px}
.pgroup h4 button{margin-left:auto;text-transform:none;letter-spacing:0;font-size:13px;color:var(--rq);font-weight:600}
.trow.leaving{animation:leave .4s ease forwards}
@keyframes leave{to{opacity:0;transform:translateX(30px)}}
.empty{text-align:center;padding:30px 10px;color:var(--mute)}
.empty .f{font-family:var(--serif);font-size:26px;color:var(--rq);font-style:italic}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:rgba(255,247,239,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transform:translateX(100%);transition:transform .34s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.overlay.open{transform:none;visibility:visible}
#note{z-index:60}
#search{background:rgba(255,247,239,.9);transform:translateY(16px);opacity:0;transition:opacity .22s,transform .22s}
#search.open{opacity:1;transform:none}
.ov-top{display:flex;align-items:center;gap:8px;background:rgba(255,247,239,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:4;padding:calc(var(--st) + 10px) calc(var(--sr) + 12px) 8px calc(var(--sl) + 8px);flex:none}
.back{display:flex;align-items:center;gap:2px;color:var(--rq);font-weight:600;font-size:16px;padding:8px 8px 8px 4px}
.back svg{width:22px;height:22px}
.saved{font-size:12px;color:var(--mute);margin-left:auto;margin-right:4px;transition:opacity .3s}
.scroller{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.paper{max-width:760px;margin:0 auto calc(var(--sb) + 60px);padding:22px 20px 26px;background:var(--card-strong);border-radius:26px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.9);min-height:calc(100% - 20px);position:relative;overflow:hidden}
.paper::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--rp),var(--rq),var(--sa))}
.note-wrap{padding:4px calc(var(--sr) + 12px) 0 calc(var(--sl) + 12px)}
.note-wrap.slide-l{animation:slideL .28s ease}
.note-wrap.slide-r{animation:slideR .28s ease}
@keyframes slideL{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.n-date{font-size:12.5px;letter-spacing:1.8px;text-transform:uppercase;font-weight:600;color:var(--rq);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.n-date .tag{margin:0}
.n-title{width:100%;border:0;background:transparent;outline:none;font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.1;color:var(--ink);padding:6px 0 4px;margin:0}
.n-title::placeholder{color:#D5BDC3}
.n-prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute);margin:4px 0 12px}
.n-prog .bar{flex:1}
.ntasks .trow{padding:9px 0;align-items:flex-start}
.ntasks .trow.lv1{margin-left:28px}
.ntasks .trow.lv2{margin-left:56px}
.ttext{flex:1;min-width:0;outline:none;font-size:17px;line-height:1.4;padding:1px 0;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.ttext:empty::before{content:'Nova atividade';color:#CDB4BA}
.more{flex:none;width:30px;height:26px;border-radius:8px;color:#C5A2AA;display:grid;place-items:center}
.more svg{width:18px;height:18px}
.trow.hit{background:rgba(234,185,195,.28);border-radius:10px}
.empty-tasks{font-size:14px;color:#C4A3AB;padding:8px 0}
.addtask{display:flex;align-items:center;gap:10px;color:var(--rq);font-weight:600;padding:12px 0 6px;font-size:16px}
.addtask .plus{width:23px;height:23px;border-radius:50%;border:1.6px dashed var(--rp);display:grid;place-items:center;font-size:17px;line-height:1}

<script>
'use strict';
/* =========================================================

   ========================================================= */
const SEED_RAW = {

  '2026-11-26':['Estudos para OSCE',[

    ['osce','Exame clínico geniturinário'],
    ['osce','Alteração da coloração da urina'],
    ['multi','Semana 16']]],
  '2026-11-27':['Estudos para OSCE',[
    ['osce','Quebra de sigilo (gravidez na adolescência)'],
    ['osce','Exame da genitália: criptorquidia, hipospádia, extrofia e varicocele'],
    ['osce','Classificação de Tanner + amenorreia primária'],
    ['osce','Técnicas de amamentação'],
    ['multi','Semana 17']]],
  '2026-11-28':['Estudos para OSCE',[
    ['osce','DRGE e dispepsia'],
    ['osce','Diarreia'],
    ['osce','Hemorragias digestivas alta e baixa'],
    ['osce','Hepatites'],
    ['multi','Revisão das semanas 7 a 11']]],
  '2026-11-29':['Estudos para OSCE',[
    ['osce','Urolitíase e câncer de próstata'],
    ['osce','Gestação e pré-natal'],
    ['osce','Nódulos mamários, úlceras e corrimento vaginal'],
    ['osce','Simulado geral de estações do OSCE'],
    ['multi','Revisão das semanas 12 a 17']]],
  '2026-11-30':['Prova OSCE',[
    ['prova','PROVA OSCE']]],
  '2026-12-01':['Revisão final da Multi N2',[['multi','Revisão: semanas 7, 8 e 9']]],
  '2026-12-02':['Revisão final da Multi N2',[['multi','Revisão: semanas 10, 11 e 12']]],
  '2026-12-03':['Revisão final da Multi N2',[['multi','Revisão: semanas 13, 14 e 15']]],
  '2026-12-04':['Revisão final da Multi N2',[['multi','Revisão: semanas 16, 17 e 7']]],
  '2026-12-05':['Revisão final da Multi N2',[['multi','Revisão: semanas 8, 9 e 10']]],
  '2026-12-06':['Revisão final da Multi N2',[['multi','Revisão: semanas 11, 12 e 13']]],
  '2026-12-07':['Prova Multi N2',[['prova','PROVA MULTI N2']]]
};
const TAGS = {n3:'N3', osce:'OSCE', multi:'Multi N2', prova:'Prova'};
function seedDay(k){
  const [title, list] = SEED_RAW[k];
  return {title, notes:'', updatedAt:0,
    tasks:list.map(([tag,text],i)=>({id:`s-${k}-${i}`, text, done:false, level:0, tag}))};
}

/* =========================================================
   Utilidades de data
   ========================================================= */
const START='2026-11-17', END='2026-12-31';
const WD=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const WD3=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MO=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dateOf=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(k,n)=>{const d=dateOf(k);d.setDate(d.getDate()+n);return keyOf(d);};
const inRange=k=>k>=START&&k<=END;
const realToday=()=>keyOf(new Date());
const todayKey=()=>{const t=realToday();return t<START?START:(t>END?END:t);};
const fmtLong=k=>{const d=dateOf(k);return `${WD[d.getDay()]}, ${d.getDate()} de ${MO[d.getMonth()]}`;};
const fmtShort=k=>{const d=dateOf(k);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`;};
const diffDays=(a,b)=>Math.round((dateOf(b)-dateOf(a))/864e5);
const weekStart=k=>{const d=dateOf(k);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return keyOf(d);};
function allKeys(){const out=[];for(let k=START;k<=END;k=addDays(k,1))out.push(k);return out;}
const KEYS=allKeys();

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));

/* =========================================================
   Estado + salvamento (aparelho + conta)
   ========================================================= */
const LS='meu-planner-notas-v1';
let state={days:{},settings:{name:'',updatedAt:0}};
function normDay(d){
  d=d&&typeof d==='object'?d:{};
  const tasks=Array.isArray(d.tasks)?d.tasks.filter(t=>t&&typeof t==='object').map(t=>({
    id:String(t.id||uid()), text:String(t.text??''), done:!!t.done,
    level:Math.max(0,Math.min(2,Number(t.level)||0)), tag:TAGS[t.tag]?t.tag:''})):[];
  return {title:String(d.title??''), notes:String(d.notes??''), tasks, updatedAt:Number(d.updatedAt)||0};
}
function loadLocal(){
  try{
    const raw=localStorage.getItem(LS);
    if(raw){const o=JSON.parse(raw);
      if(o&&o.days&&typeof o.days==='object')state.days=o.days;
      if(o&&o.settings)state.settings={name:String(o.settings.name||''),updatedAt:Number(o.settings.updatedAt)||0};}
  }catch(e){}
  for(const k in SEED_RAW) if(!state.days[k]) state.days[k]=seedDay(k);
  for(const k in state.days){ if(!/^\d{4}-\d\d-\d\d$/.test(k)){delete state.days[k];continue;} state.days[k]=normDay(state.days[k]); }
}
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
function getDay(k){return state.days[k]||(state.days[k]={title:'',tasks:[],notes:'',updatedAt:0});}
function hasContent(d){return d&&(d.tasks.length||d.title.trim()||stripHtml(d.notes).trim());}

const remote={ok:false,col:null,synced:false,mode:'local'};
const pendingT={}, writing={};
let lastEdit=0;
function commit(k,opts={}){
  const d=getDay(k); d.updatedAt=Date.now(); lastEdit=Date.now();
  persistLocal(); scheduleRemote(k); flashSaved();
  if(!opts.noRender) scheduleRender(opts.delay||120);
}
function scheduleRemote(k){
  if(!remote.ok) return;
  clearTimeout(pendingT[k]); pendingT[k]=setTimeout(()=>flushRemote(k),700);
}
async function flushRemote(k,retry){
  if(!remote.ok) return;
  if(writing[k]){writing[k].again=true;return;}
  writing[k]={again:false};
  try{
    const body = k==='settings' ? clone(state.settings) : clone(getDay(k));
    await remote.col.doc(k).set(body);
  }catch(e){
    const c=e&&e.code;
    if(c==='unavailable'&&!retry){ writing[k]=null; setTimeout(()=>flushRemote(k,true),800+Math.random()*1200); return; }
    if(c==='quota_exceeded'){ toast('Espaço de armazenamento cheio — as notas continuam salvas neste aparelho.'); }
    else if(c==='invalid_argument'||c==='revoked'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed'){ remote.ok=false; setMode('local'); }
  }
  const again=writing[k]&&writing[k].again; writing[k]=null;
  if(again) flushRemote(k);
}
function setMode(m){remote.mode=m;}

async function initRemote(){
  try{
    let tries=0;
    while(!(window.claude&&typeof window.claude.use==='function')&&tries<15){await new Promise(r=>setTimeout(r,200));tries++;}
    if(!(window.claude&&typeof window.claude.use==='function')) return setMode('local');
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return setMode('local');
    const id=await user.id();
    if(!id) return setMode('local');
    remote.col=db.collection('data/users/'+id);
    remote.ok=true; setMode('connecting');
    const timer=setTimeout(()=>{ if(!remote.synced&&remote.ok) setMode('slow'); },10000);
    remote.col.onSnapshot(snap=>{
      let changed=false; const seen={};
      for(const doc of snap.docs){
        const data=doc.data(); if(!data) continue;
        const rU=Number(data.updatedAt)||0; seen[doc.id]=rU;
        if(doc.id==='settings'){
          if(rU>(state.settings.updatedAt||0)){state.settings={name:String(data.name||''),updatedAt:rU};changed=true;}
          continue;
        }
        if(!/^\d{4}-\d\d-\d\d$/.test(doc.id)) continue;
        const local=state.days[doc.id];
        if(!local||rU>(local.updatedAt||0)){
          if(noteKey===doc.id&&Date.now()-lastEdit<4000) continue; // não atrapalhar quem está digitando
          state.days[doc.id]=normDay(clone(data)); changed=true;
          if(noteKey===doc.id) renderNote(doc.id);
        }
      }
      if(!snap.metadata.fromCache&&!remote.synced){
        remote.synced=true; clearTimeout(timer); setMode('cloud');
        for(const k in state.days){const u=state.days[k].updatedAt||0; if(u>0&&u>(seen[k]||0)) scheduleRemote(k);}
        if((state.settings.updatedAt||0)>(seen.settings||0)) scheduleRemote('settings');
      }
      if(changed){persistLocal();renderAll();}
    },err=>{clearTimeout(timer);remote.ok=false;setMode('local');});
  }catch(e){remote.ok=false;setMode('local');}
}

/* =========================================================
   Helpers de conteúdo
   ========================================================= */
const htmlCache=new Map();
function stripHtml(html){
  if(!html) return '';
  if(htmlCache.has(html)) return htmlCache.get(html);
  const t=new DOMParser().parseFromString(html.replace(/<(br|\/div|\/p|\/li|\/h\d)[^>]*>/gi,' '),'text/html').body.textContent.replace(/\s+/g,' ').trim();
  if(htmlCache.size>300) htmlCache.clear();
  htmlCache.set(html,t); return t;
}
const ALLOWED=new Set(['B','STRONG','I','EM','U','UL','OL','LI','BR','DIV','P','SPAN','BLOCKQUOTE','S','STRIKE','FONT']);
function sanitize(html){
  const doc=new DOMParser().parseFromString('<div>'+(html||'')+'</div>','text/html');
  const root=doc.body.firstChild;
  (function walk(n){
    for(const c of [...n.childNodes]){
      if(c.nodeType===1){
        if(!ALLOWED.has(c.tagName)){
          if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META'].includes(c.tagName)){c.remove();continue;}
          walk(c); c.replaceWith(...c.childNodes); continue;
        }
        for(const a of [...c.attributes]) c.removeAttribute(a.name);
        walk(c);
      }else if(c.nodeType!==3){c.remove();}
    }
  })(root);
  return root.innerHTML;
}
function prog(keys){let done=0,total=0;for(const k of keys){const d=state.days[k];if(!d)continue;for(const t of d.tasks){total++;if(t.done)done++;}}return {done,total,pct:total?Math.round(done/total*100):0};}
const isExam=k=>{const d=state.days[k];return !!(d&&d.tasks.some(t=>t.tag==='prova'));};
const tagsOf=k=>{const d=state.days[k];if(!d)return[];const s=[];for(const t of d.tasks){const g=t.tag||'none';if(!s.includes(g))s.push(g);}return s.slice(0,4);};
function pendingList(){const out=[];for(const k of KEYS){const d=state.days[k];if(!d)continue;for(const t of d.tasks)if(!t.done&&t.text.trim())out.push({k,t});}return out;}

function monthGrid(y,m,opts={}){
  const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate(), off=first.getDay();
  const tk=realToday();
  let h=`<div class="grid7 ${opts.mini?'mini':''}">`+['D','S','T','Q','Q','S','S'].map(x=>`<div class="wd">${x}</div>`).join('');
  for(let i=0;i<off;i++) h+='<div class="cell blank"></div>';
  for(let d=1;d<=days;d++){
    const k=`${y}-${pad(m+1)}-${pad(d)}`, ok=inRange(k), day=state.days[k];
    const cls=['cell']; if(!ok)cls.push('off'); if(k===tk)cls.push('today'); if(ok&&isExam(k))cls.push('exam');
    if(opts.picked===k)cls.push('picked');
    let inner=`<span class="num">${d}</span>`;
    if(ok&&!opts.pick&&day&&day.tasks.length){
      const p=prog([k]); if(p.total&&p.done===p.total)cls.push('alldone');
      if(isExam(k)&&!opts.mini) inner+=`<span class="lab">PROVA</span>`;
      else inner+=`<span class="dots">${tagsOf(k).map(g=>`<i class="dot dot-${g}"></i>`).join('')}</span>`;
      if(!opts.mini){inner+=`<span class="frac">${p.done}/${p.total}</span>`;
        inner+=`<span class="pv">${day.tasks.slice(0,3).map(t=>`<div class="${t.done?'d':''}">${esc(t.text)}</div>`).join('')}${day.tasks.length>3?`<div class="muted">+${day.tasks.length-3}</div>`:''}</span>`;}
    }else if(ok&&!opts.pick&&day&&stripHtml(day.notes)){inner+=`<span class="dots"><i class="dot dot-none"></i></span>`;}
    const act=opts.pick?`data-pick="${k}"`:`data-act="openNote" data-k="${k}"`;
    h+=`<button class="${cls.join(' ')}" ${ok?act:'disabled'} aria-label="${fmtLong(k)}">${inner}</button>`;
  }
  return h+'</div>';
}

function renderNoteTasks(focusTid,hit){

function updateNoteProg(){const p=prog([noteKey]);const b=$('#nBar'),t=$('#nProg');if(b)b.style.width=p.pct+'%';if(t)t.textContent=p.total?`${p.done} de ${p.total} concluídas`:'sem atividades';}

function setLevel(k,tid,delta,refocus){

function findTask(k,tid){const d=getDay(k);const i=d.tasks.findIndex(t=>t.id===tid);return {d,i,t:d.tasks[i]};}
function toggleTask(k,tid,btn){
  const {t}=findTask(k,tid);if(!t)return;t.done=!t.done;

  if(t.done&&tab==='pend'&&btn&&btn.closest('#s-pend'))btn.closest('.trow').classList.add('leaving');
  if(noteKey===k)updateNoteProg();
  commit(k,{delay:t.done&&tab==='pend'?450:380});
  if(t.done){const p=prog([k]);if(p.total>1&&p.done===p.total)toast('Dia concluído! Parabéns ✿');}
}
let undoSnap=null;
function snapshot(keys){undoSnap=keys.map(k=>[k,clone(getDay(k))]);}
function undo(){if(!undoSnap)return;for(const [k,d] of undoSnap){state.days[k]=d;commit(k,{noRender:true});}const ks=undoSnap.map(x=>x[0]);undoSnap=null;renderAll();if(noteKey&&ks.includes(noteKey))renderNote(noteKey);hideToast();}
function blockOf(d,i){let j=i+1;while(j<d.tasks.length&&d.tasks[j].level>d.tasks[i].level)j++;return j-i;}
function deleteTask(k,tid){
  const {d,i}=findTask(k,tid);if(i<0)return;snapshot([k]);
  d.tasks.splice(i,1);normalizeLevels(d);commit(k);if(noteKey===k)renderNoteTasks();
  toast('Atividade excluída',true);
}
function moveTask(fromK,tid,toK,beforeId){
  if(!inRange(toK))return;
  const src=getDay(fromK),i=src.tasks.findIndex(t=>t.id===tid);if(i<0)return;
  snapshot(fromK===toK?[fromK]:[fromK,toK]);
  const n=blockOf(src,i),block=src.tasks.splice(i,n);
  const dst=getDay(toK);let at=beforeId?dst.tasks.findIndex(t=>t.id===beforeId):-1;if(at<0)at=dst.tasks.length;
  const base=block[0].level;block.forEach(t=>t.level-=base);
  dst.tasks.splice(at,0,...block);normalizeLevels(dst);normalizeLevels(src);
  commit(fromK,{noRender:true});if(fromK!==toK)commit(toK,{noRender:true});
  renderAll();if(noteKey&&(noteKey===fromK||noteKey===toK))renderNoteTasks();
  if(fromK!==toK)toast(`Movida para ${fmtShort(toK)}`,true);
}
function taskMenu(k,tid){

    canIn?{ic:IC.indent,label:'Transformar em subtópico',fn:()=>setLevel(k,tid,1)}:null,
    t.level>0?{ic:IC.outdent,label:'Voltar ao nível principal',fn:()=>setLevel(k,tid,-1)}:null,

/* =========================================================
   Busca global
   ========================================================= */
function fold(s){let out='';const map=[];for(let i=0;i<s.length;i++){const f=s[i].normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();for(const ch of f){out+=ch;map.push(i);}}return {out,map};}
function findRanges(text,q){const Q=fold(q.trim()).out;if(!Q||!text)return[];const F=fold(text),r=[];let i=0;while((i=F.out.indexOf(Q,i))!==-1){r.push([F.map[i],F.map[i+Q.length-1]+1]);i+=Q.length;}return r;}
function hl(text,q){const rs=findRanges(text,q);let out='',last=0;for(const [s,e] of rs){out+=esc(text.slice(last,s))+'<mark>'+esc(text.slice(s,e))+'</mark>';last=e;}return out+esc(text.slice(last));}
function snippet(text,q){const r=findRanges(text,q)[0];if(!r)return esc(text.slice(0,100));const s=Math.max(0,r[0]-45),e=Math.min(text.length,r[1]+70);return (s>0?'…':'')+hl(text.slice(s,e),q)+(e<text.length?'…':'');}
function openSearch(){const s=$('#search');s.classList.add('open');s.setAttribute('aria-hidden','false');document.body.classList.add('locked');runSearch();setTimeout(()=>$('#q').focus(),60);}
function closeSearch(){const s=$('#search');s.classList.remove('open');s.setAttribute('aria-hidden','true');$('#q').blur();if(!noteKey)document.body.classList.remove('locked');}
function runSearch(){
  const q=$('#q').value; $('#qclear').classList.toggle('show',!!q);
  const box=$('#sres');
  if(!q.trim()){box.innerHTML=`<div class="shint"><div class="f">O que você procura?</div><div class="small">Busque por títulos, atividades (pendentes ou concluídas), etiquetas e qualquer palavra das suas anotações, em todos os dias.</div></div>`;return;}
  const res=[];let total=0;
  for(const k of Object.keys(state.days).sort()){
    if(!inRange(k))continue;const d=state.days[k],lines=[];
    if(findRanges(fmtLong(k),q).length||findRanges(fmtShort(k),q).length)lines.push(`<div class="sline"><span class="k">data</span><span>${hl(fmtLong(k),q)}</span></div>`);
    if(findRanges(d.title,q).length)lines.push(`<div class="sline"><span class="k">título</span><span>${hl(d.title,q)}</span></div>`);
    for(const t of d.tasks){const lab=t.tag?TAGS[t.tag]:'';if(findRanges(t.text,q).length||(lab&&findRanges(lab,q).length))lines.push(`<div class="sline"><span class="k ${t.done?'ok':''}">${t.done?'✓ feita':'pendente'}</span><span>${hl(t.text,q)}${lab?` <span class="tag tag-${t.tag}">${hl(lab,q)}</span>`:''}</span></div>`);}
    const nt=stripHtml(d.notes);if(findRanges(nt,q).length)lines.push(`<div class="sline"><span class="k">nota</span><span>${snippet(nt,q)}</span></div>`);
    if(lines.length){total+=lines.length;res.push(`<button class="card sday" data-act="openNote" data-k="${k}" data-hit="1"><div class="sd">${esc(fmtLong(k))}${isExam(k)?' <span class="tag tag-prova">PROVA</span>':''}</div>${lines.join('')}</button>`);}
  }
  box.innerHTML=res.length?`<div class="scount">${total} resultado${total>1?'s':''} em ${res.length} dia${res.length>1?'s':''}</div>${res.join('')}`:`<div class="shint"><div class="f">Nada encontrado</div><div class="small">Nenhuma nota contém “${esc(q.trim())}”.</div></div>`;
}

/* =========================================================
   Arrastar atividades (toque e mouse)
   ========================================================= */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('.grip');if(!g)return;
  const row=g.closest('.trow'),zone=row&&row.closest('[data-drop-day]');if(!row||!zone)return;
  e.preventDefault();
  const r=row.getBoundingClientRect(),ghost=row.cloneNode(true);
  ghost.classList.add('ghost');ghost.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));
  Object.assign(ghost.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px'});document.body.appendChild(ghost);
  row.classList.add('dragging');
  drag={tid:row.dataset.tid,from:zone.dataset.dropDay,ghost,row,dx:e.clientX-r.left,dy:e.clientY-r.top,x:e.clientX,y:e.clientY,zone:null,before:null,line:document.createElement('div'),raf:0};
  drag.line.className='drop-line';
  window.addEventListener('pointermove',onDrag,{passive:false});
  window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
  drag.raf=requestAnimationFrame(autoScroll);onDrag(e);
});
function onDrag(e){
  if(!drag)return;e.preventDefault&&e.preventDefault();
  drag.x=e.clientX;drag.y=e.clientY;
  drag.ghost.style.left=(e.clientX-drag.dx)+'px';drag.ghost.style.top=(e.clientY-drag.dy)+'px';
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const zone=el&&(el.closest('[data-drop-day]')||(el.closest('.wcard')&&el.closest('.wcard').querySelector('[data-drop-day]')));
  if(drag.zone&&drag.zone!==zone)drag.zone.closest('.card,.paper')?.classList.remove('drop-on');
  drag.zone=zone||null;
  if(!zone){drag.line.remove();return;}
  zone.closest('.card,.paper')?.classList.add('drop-on');
  const rows=[...zone.querySelectorAll(':scope > .trow')].filter(r=>r!==drag.row);
  let before=null;for(const r of rows){const b=r.getBoundingClientRect();if(e.clientY<b.top+b.height/2){before=r;break;}}
  drag.before=before?before.dataset.tid:null;
  if(before)zone.insertBefore(drag.line,before);else zone.appendChild(drag.line);
}
function autoScroll(){
  if(!drag)return;
  const sc=(drag.zone&&drag.zone.closest('.scroller'))||($('#note').classList.contains('open')?$('#note .scroller'):null);
  const H=window.innerHeight,edge=90;let v=0;
  if(drag.y<edge)v=-Math.ceil((edge-drag.y)/6);else if(drag.y>H-edge)v=Math.ceil((drag.y-(H-edge))/6);
  if(v){if(sc)sc.scrollTop+=v;else window.scrollBy(0,v);}
  drag.raf=requestAnimationFrame(autoScroll);
}
function endDrag(){
  if(!drag)return;const d=drag;drag=null;cancelAnimationFrame(d.raf);
  window.removeEventListener('pointermove',onDrag);window.removeEventListener('pointerup',endDrag);window.removeEventListener('pointercancel',endDrag);
  d.ghost.remove();d.line.remove();d.row.classList.remove('dragging');$$('.drop-on').forEach(x=>x.classList.remove('drop-on'));
  if(d.zone){const to=d.zone.dataset.dropDay;if(!(to===d.from&&d.before===d.tid))moveTask(d.from,d.tid,to,d.before);}
  else renderAll();
}

   ========================================================= */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a||a.disabled)return;
  const k=a.dataset.k,tid=a.dataset.tid;
  switch(a.dataset.act){
    case 'tab':setTab(a.dataset.tab);break;
    case 'openNote':{const q=a.dataset.hit?$('#q').value:null;openNote(k,{hit:q});break;}
    case 'closeNote':closeNote();break;
    case 'gotoDay':{const dir=k>noteKey?'slide-l':'slide-r';if(document.activeElement)document.activeElement.blur();noteKey=k;renderNote(k,{slide:dir});$('#note .scroller').scrollTop=0;break;}
    case 'toggle':e.stopPropagation();toggleTask(k,tid,a);break;
    case 'taskMenu':taskMenu(k,tid);break;
    case 'addTask':addTaskAt(getDay(noteKey).tasks.length);break;
    case 'openSearch':openSearch();break;
    case 'closeSearch':closeSearch();break;
    case 'clearSearch':e.preventDefault();$('#q').value='';runSearch();$('#q').focus();break;
    case 'calPrev':calMonth=Math.max(10,calMonth-1);renderCal();break;
    case 'calNext':calMonth=Math.min(11,calMonth+1);renderCal();break;
    case 'weekPrev':weekK=addDays(weekK,-7);renderWeek();break;
    case 'weekNext':weekK=addDays(weekK,7);renderWeek();break;
    case 'pendFilter':pendFilter=a.dataset.f;renderPend();break;
    case 'quickAdd':quickAdd(tab==='week'?(inRange(realToday())&&weekStart(realToday())===weekK?realToday():[0,1,2,3,4,5,6].map(i=>addDays(weekK,i)).find(inRange)):todayKey());break;
    case 'settings':settingsSheet();break;
    case 'closeSheet':closeSheet();break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#sheet').classList.contains('open'))closeSheet();else if(noteKey)closeNote();else if($('#search').classList.contains('open'))closeSearch();}});

/* =========================================================
   Fundo floral (papel de parede tropical)
   ========================================================= */
const PAL={coral:['#F9B3A1','#EE8070','#B53A4A'],pink:['#F8CAD3','#E994A9','#A6405C'],red:['#F39A98','#D9545F','#8C2437'],peach:['#FCDCC4','#F4AE8C','#C4644D']};
let gid=0;
function flowerSVG(x,y,r,rot,pal){
  const id='fg'+(gid++),[c1,c2,c3]=PAL[pal];
  const P=`M0 0 C ${r*.22} ${-r*.46}, ${r*.8} ${-r*.66}, ${r*1.0} ${-r*.2} C ${r*1.08} ${r*.04}, ${r*.93} ${r*.12}, ${r*1.0} ${r*.27} C ${r*.84} ${r*.66}, ${r*.26} ${r*.48}, 0 0 Z`;
  let h=`<radialGradient id="${id}" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="${r}"><stop offset="0" stop-color="${c3}"/><stop offset=".3" stop-color="${c2}"/><stop offset="1" stop-color="${c1}"/></radialGradient><g transform="translate(${x} ${y}) rotate(${rot})">`;
  for(let i=0;i<5;i++)h+=`<path d="${P}" fill="url(#${id})" transform="rotate(${i*72})" stroke="${c1}" stroke-width="${r*.012}" stroke-opacity=".6"/>`;
  for(let i=0;i<5;i++)h+=`<path d="M${r*.12} 0 Q ${r*.45} ${-r*.05} ${r*.7} ${-r*.12}" stroke="${c3}" stroke-opacity=".25" stroke-width="${r*.015}" fill="none" transform="rotate(${i*72+10})"/>`;
  h+=`<circle r="${r*.14}" fill="${c3}" opacity=".55"/><path d="M0 0 Q ${r*.25} ${-r*.12} ${r*.6} ${-r*.42}" stroke="#E9B44C" stroke-width="${r*.035}" fill="none" stroke-linecap="round"/>`;
  for(let i=0;i<6;i++){const a=-0.62+i*.11;h+=`<circle cx="${r*.6+Math.cos(a*6)*r*.06}" cy="${-r*.42+Math.sin(a*6)*r*.06}" r="${r*.03}" fill="#F6D27A"/>`;}
  return h+'</g>';
}
function leafSVG(x,y,len,rot,col){
  return `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M0 0 C ${len*.28} ${-len*.3}, ${len*.74} ${-len*.24}, ${len} 0 C ${len*.74} ${len*.24}, ${len*.28} ${len*.3}, 0 0Z" fill="${col}"/><path d="M${len*.05} 0 L ${len*.92} 0" stroke="rgba(255,255,255,.4)" stroke-width="${len*.012}"/></g>`;
}
function drawBg(){
  gid=0;const W=innerWidth,H=innerHeight,s=Math.max(.8,Math.min(1.8,Math.min(W,H)/400));
  let rnd=7;const R=()=>(rnd=(rnd*9301+49297)%233280)/233280;
  const L=['#A9B89A','#8FA383','#B9C4AA','#7D9270'];
  let h=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><defs><linearGradient id="wash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF7EF"/><stop offset=".5" stop-color="#FCEFEB"/><stop offset="1" stop-color="#F9E9E9"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#wash)"/>`;
  const n=Math.round(W*H/7000);
  for(let i=0;i<n;i++){const x=R()*W,y=R()*H,r=2+R()*2.4;h+=`<g transform="translate(${x} ${y})" fill="#EAB9C3" opacity="${.25+R()*.2}">${[0,72,144,216,288].map(a=>`<ellipse rx="${r}" ry="${r*.6}" cx="${r}" transform="rotate(${a})"/>`).join('')}<circle r="${r*.5}" fill="#F3D3A6"/></g>`;}
  const F=[[W-30*s,60*s,100*s,15,'coral'],[18*s,175*s,62*s,-20,'peach'],[W+6*s,H*.48,58*s,40,'pink'],[-8*s,H*.64,72*s,10,'red'],[W-46*s,H-48*s,108*s,-12,'pink'],[52*s,H+12*s,82*s,30,'coral'],[W-155*s,16*s,30*s,0,'peach'],[W-8*s,215*s,26*s,20,'red'],[W*.5,H+20*s,40*s,50,'peach']];
  for(const [x,y,r] of F){for(let j=0;j<3;j++)h+=leafSVG(x,y,r*(1.35+R()*.4),R()*360,L[Math.floor(R()*L.length)]);}
  for(const [x,y,r,rot,p] of F)h+=flowerSVG(x,y,r,rot,p);
  $('#bg').innerHTML=h+'</svg>';
}
let bgT=null;addEventListener('resize',()=>{clearTimeout(bgT);bgT=setTimeout(drawBg,200);});

/* =========================================================
   Início
   ========================================================= */
loadLocal();
drawBg();
renderAll();
initRemote();
// atualiza "hoje" quando o app fica aberto de um dia para o outro
let lastDay=realToday();
setInterval(()=>{if(realToday()!==lastDay){lastDay=realToday();renderAll();}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&realToday()!==lastDay){lastDay=realToday();renderAll();}});
</script>
